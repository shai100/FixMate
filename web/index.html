<!doctype html>
<!--
  The single HTML page the browser loads (Vite's entry document).
  It sets up the viewport for mobile/notch support and the dark theme color,
  preloads the web fonts, then hands off to the app: <div id="root"> is where
  React mounts, and the module script boots src/main.tsx. Everything else the
  user sees is rendered by React into #root.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F1A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>FixMate — Technician App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
