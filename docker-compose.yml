# Local development stack for FixMate. `docker compose up` starts the four
# backing services plus the Celery ingestion worker; the API runs on the host
# against them. Each backing service maps to a settings.py default so a fresh
# clone runs with no extra config. (See setup-instructions.md.)
services:
  # PostgreSQL with the pgvector extension preinstalled: the main database AND
  # the vector store for embeddings (one datastore keeps RLS tenant isolation
  # simple). The healthcheck lets dependents wait until it's accepting queries.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fixmate
      POSTGRES_PASSWORD: fixmate
      POSTGRES_DB: fixmate
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fixmate"], interval: 5s, retries: 10 }
  # Redis: the Celery message broker + result backend for async ingestion jobs.
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # MinIO: S3-compatible object storage for original PDFs and extracted figures.
  # Same API as AWS S3, so cloud deploys swap the endpoint with no code change.
  # Port 9000 is the S3 API; 9001 is the web console.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: fixmate, MINIO_ROOT_PASSWORD: fixmate123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  # Ollama: serves the local open-weight models (generation + BGE-M3 embeddings)
  # used in dev. Embeddings always run here even when LLM_PROVIDER=anthropic.
  # Pinned to 0.6.x: 0.5+ properly honours the `think: false` param for qwen3,
  # preventing runaway chain-of-thought generation that would exceed the 12s SLO.
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollamadata:/root/.ollama]
    # GPU passthrough (WSL2 + NVIDIA driver). Alternative: run Ollama natively on
    # Windows and set OLLAMA_BASE_URL=http://host.docker.internal:11434 (spec §8.2).
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
  # Celery ingestion worker: consumes upload tasks from Redis and runs the
  # ingestion pipeline. Running it in Compose (rather than as a manually-started
  # host process) means uploads are always processed — a missing worker used to
  # leave uploads stuck on "Queued for ingestion…" forever. Env vars point the
  # shared settings at the Compose service hostnames instead of the host defaults.
  worker:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
      ollama: { condition: service_started }
    environment:
      DATABASE_URL: postgresql+asyncpg://fixmate:fixmate@postgres:5432/fixmate
      DATABASE_APP_URL: postgresql+asyncpg://fixmate_app:fixmate_app@postgres:5432/fixmate
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
      # Resolves staged uploads to /uploads, the container side of the bind mount
      # below. The host API stages them to ./.fixmate-uploads (settings default),
      # so both sides see the same bytes via only the filename (no host paths).
      UPLOAD_DIR: /uploads
    volumes: ["./.fixmate-uploads:/uploads"]
  # Keycloak: OIDC identity provider for production auth (Phase 9). Behind the
  # "auth" profile so it doesn't start by default — dev uses header auth instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
    ports: ["8080:8080"]
    profiles: ["auth"]   # not started until Phase 9: docker compose --profile auth up -d
volumes: { pgdata: {}, miniodata: {}, ollamadata: {} }
