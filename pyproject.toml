# Python project metadata, dependencies, and tool config for the FixMate backend.
# `pip install -e .` installs the runtime deps; `pip install -e .[dev]` adds the
# test/lint tools. The [tool.*] sections configure pytest (async mode + the
# `integration` marker for tests needing live services) and ruff (lint/format).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Runtime dependencies, grouped by role:
#   web API:    fastapi, uvicorn, python-multipart, pyjwt
#   database:   sqlalchemy, asyncpg, alembic, pgvector
#   workers:    celery, redis
#   LLM/IO:     httpx, anthropic, boto3 (S3), pymupdf (PDF)
#   config:     pydantic-settings, pyyaml
name = "fixmate"
# Patch is auto-incremented on every commit by the .githooks/pre-commit hook,
# kept in lockstep with the web client's commit-count-derived patch (web/vite.config.ts).
version = "0.1.51"
description = "AI-powered troubleshooting assistant for field technicians"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pgvector",
    "celery[redis]",
    "redis",
    "httpx",
    "anthropic",
    "boto3",
    "pymupdf",
    "pydantic-settings",
    "python-multipart",
    "pyjwt[crypto]",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["fixmate*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires docker compose services running",
]

[tool.ruff]
line-length = 100
target-version = "py312"
